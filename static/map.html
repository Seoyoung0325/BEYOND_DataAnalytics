<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Engine</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>

<style>
  html, body, #map {
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    overflow: hidden;
    background-color: #2a4067;
  }
  .leaflet-container { background: #2a4067 !important; }
  .leaflet-tile {
    opacity: 0.5 !important;
    filter: sepia(100%) hue-rotate(180deg) saturate(300%) brightness(3.0) contrast(1.1) !important;
  }
  .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body>

<div id="map"></div>

<script>
var map = L.map('map', { zoomControl: false }).setView([37.5050, 127.0250], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

var routeLayerGroup = L.layerGroup().addTo(map);

function renderRouteData(data) {
  routeLayerGroup.clearLayers();

  var allBounds = [];

  // 각 지하철 노선 구간별 색상 적용 처리
  if (data.segments && data.segments.length > 0) {
    data.segments.forEach(function(seg) {
      // 구간 그림자 선
      L.polyline(seg.path, {
        color: "#000000", weight: 9, opacity: 0.3, lineCap: "round", lineJoin: "round"
      }).addTo(routeLayerGroup);

      // 구간 노선 선 (3호선: 주황 / 2호선: 초록)
      var polyline = L.polyline(seg.path, {
        color: seg.color || "#F5A623", weight: 6, opacity: 1.0, lineCap: "round", lineJoin: "round"
      }).addTo(routeLayerGroup);

      allBounds.push(polyline.getBounds());
    });
  }

  // 경유 지하철역 작은 원 마커
  if (data.stations) {
    data.stations.forEach(function(pt) {
      L.circleMarker(pt, {
        color: "#ffffff", fillColor: "#888888", fillOpacity: 0.9, radius: 4, weight: 1.5
      }).addTo(routeLayerGroup);
    });
  }

  // 출발지 마커 & 말풍선 (빨간색)
  L.circleMarker(data.start, {
    color: "#ffffff", fillColor: "#ff3b30", fillOpacity: 1, radius: 8, weight: 3
  }).addTo(routeLayerGroup);

  var startMarker = L.marker(data.start, {}).addTo(routeLayerGroup);
  startMarker.setIcon(L.divIcon({
    html: '<div style="position:relative;background:#ff3b30;color:#fff;font-size:13px;font-weight:800;padding:5px 12px;border-radius:8px;white-space:nowrap;font-family:sans-serif;box-shadow:0 3px 8px rgba(0,0,0,0.5);margin-left:10px;margin-top:-44px">출발<div style="position:absolute;bottom:-6px;right:6px;width:0;height:0;border-left:6px solid transparent;border-right:2px solid transparent;border-top:6px solid #ff3b30"></div></div>',
    iconSize: [60, 26], className: "empty"
  }));

  // 도착지 마커 & 말풍선 (초록색)
  L.circleMarker(data.end, {
    color: "#ffffff", fillColor: "#00A84D", fillOpacity: 1, radius: 8, weight: 3
  }).addTo(routeLayerGroup);

  var endMarker = L.marker(data.end, {}).addTo(routeLayerGroup);
  endMarker.setIcon(L.divIcon({
    html: '<div style="position:relative;background:#00A84D;color:#fff;font-size:13px;font-weight:800;padding:5px 12px;border-radius:8px;white-space:nowrap;font-family:sans-serif;box-shadow:0 3px 8px rgba(0,0,0,0.5);margin-left:10px;margin-top:-44px">도착<div style="position:absolute;bottom:-6px;left:6px;width:0;height:0;border-left:2px solid transparent;border-right:6px solid transparent;border-top:6px solid #00A84D"></div></div>',
    iconSize: [60, 26], className: "empty"
  }));

  // 전체 경로가 한눈에 보이도록 지도 구도 줌 조절
  if (allBounds.length > 0) {
    var combinedBounds = allBounds[0];
    for (var i = 1; i < allBounds.length; i++) {
      combinedBounds.extend(allBounds[i]);
    }
    map.fitBounds(combinedBounds, { padding: [60, 60] });
  }
}

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'DRAW_ROUTE') {
    renderRouteData(e.data.payload);
  }
});
</script>
</body>
</html>
