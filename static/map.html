<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Engine</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>

<style>
  html, body, #map {
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    overflow: hidden;
    background-color: #2a4067;
  }
  .leaflet-container { background: #2a4067 !important; }
  .leaflet-tile {
    opacity: 0.5 !important;
    filter: sepia(100%) hue-rotate(180deg) saturate(300%) brightness(3.0) contrast(1.1) !important;
  }
  .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body>

<div id="map"></div>

<script>
var map = L.map('map', { zoomControl: false }).setView([37.5050, 127.0250], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

var routeLayerGroup = L.layerGroup().addTo(map);

// 마커 아이콘 생성 함수
function makeMarkerIcon(label, color) {
  return L.divIcon({
    html: '<div style="position:relative;background:' + color + ';color:#fff;font-size:13px;' +
          'font-weight:800;padding:5px 12px;border-radius:8px;white-space:nowrap;' +
          'font-family:sans-serif;box-shadow:0 3px 8px rgba(0,0,0,0.5);' +
          'margin-left:10px;margin-top:-44px">' + label +
          '<div style="position:absolute;bottom:-6px;' +
          (label === '출발' ? 'right' : 'left') +
          ':6px;width:0;height:0;border-left:6px solid transparent;' +
          'border-right:2px solid transparent;border-top:6px solid ' + color + '"></div></div>',
    iconSize: [60, 26],
    className: 'empty'
  });
}

// 경로 렌더링
function renderRouteData(data) {
  routeLayerGroup.clearLayers();

  var allBounds = [];

  // 경로 구간 (지하철 + 버스 + 도보)
  if (data.segments && data.segments.length > 0) {
    data.segments.forEach(function(seg) {
      var isDash = seg.dash === true;
      var weight = isDash ? 3 : 6;

      // 그림자 (도보는 생략)
      if (!isDash) {
        L.polyline(seg.path, {
          color: "#000000", weight: 9, opacity: 0.3,
          lineCap: "round", lineJoin: "round"
        }).addTo(routeLayerGroup);
      }

      // 실선 or 점선
      var polyline = L.polyline(seg.path, {
        color:     seg.color || "#F5A623",
        weight:    weight,
        opacity:   isDash ? 0.7 : 1.0,
        dashArray: isDash ? "6 8" : null,
        lineCap:   "round",
        lineJoin:  "round"
      }).addTo(routeLayerGroup);

      allBounds.push(polyline.getBounds());
    });
  }

  // 경유 역 마커
  if (data.stations && data.stations.length > 0) {
    data.stations.forEach(function(pt) {
      L.circleMarker(pt, {
        color: "#ffffff", fillColor: "#888888",
        fillOpacity: 0.9, radius: 4, weight: 1.5
      }).addTo(routeLayerGroup);
    });
  }

  // 출발 마커
  if (data.start) {
    L.circleMarker(data.start, {
      color: "#ffffff", fillColor: "#ff3b30",
      fillOpacity: 1, radius: 8, weight: 3
    }).addTo(routeLayerGroup);
    L.marker(data.start, { icon: makeMarkerIcon('출발', '#ff3b30') }).addTo(routeLayerGroup);
  }

  // 도착 마커
  if (data.end) {
    L.circleMarker(data.end, {
      color: "#ffffff", fillColor: "#00A84D",
      fillOpacity: 1, radius: 8, weight: 3
    }).addTo(routeLayerGroup);
    L.marker(data.end, { icon: makeMarkerIcon('도착', '#00A84D') }).addTo(routeLayerGroup);
  }

  // 전체 경로가 한눈에 보이도록 지도 구도 줌 조절
  if (allBounds.length > 0) {
    var combinedBounds = allBounds[0];
    for (var i = 1; i < allBounds.length; i++) {
      combinedBounds.extend(allBounds[i]);
    }
    map.fitBounds(combinedBounds, { padding: [60, 60] });
  } else if (data.start && data.end) {
    // 경로선 없어도 출발/도착 좌표로 줌 조정
    map.fitBounds(L.latLngBounds(data.start, data.end), { padding: [80, 80] });
  }
}

// ── 페이지 로드 시 출발/도착 마커 복원 ────────────────────────────
window.addEventListener('load', function() {
  try {
    var originCoord = JSON.parse(sessionStorage.getItem('originCoord') || 'null');
    var destCoord   = JSON.parse(sessionStorage.getItem('destCoord')   || 'null');

    if (originCoord) {
      L.circleMarker([originCoord.lat, originCoord.lon], {
        color: "#ffffff", fillColor: "#ff3b30",
        fillOpacity: 1, radius: 8, weight: 3
      }).addTo(routeLayerGroup);
      L.marker([originCoord.lat, originCoord.lon], {
        icon: makeMarkerIcon('출발', '#ff3b30')
      }).addTo(routeLayerGroup);
    }

    if (destCoord) {
      L.circleMarker([destCoord.lat, destCoord.lon], {
        color: "#ffffff", fillColor: "#00A84D",
        fillOpacity: 1, radius: 8, weight: 3
      }).addTo(routeLayerGroup);
      L.marker([destCoord.lat, destCoord.lon], {
        icon: makeMarkerIcon('도착', '#00A84D')
      }).addTo(routeLayerGroup);
    }

    // 두 마커가 모두 있으면 줌 조정
    if (originCoord && destCoord) {
      map.fitBounds(
        L.latLngBounds(
          [originCoord.lat, originCoord.lon],
          [destCoord.lat,   destCoord.lon]
        ),
        { padding: [80, 80] }
      );
    }
  } catch (e) {
    console.log('마커 복원 실패:', e);
  }
});

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'DRAW_ROUTE') {
    renderRouteData(e.data.payload);
  }
});
</script>
</body>
</html>
