/*윤서영 추가 - 지도 클릭 이벤트 추가*/
var clickState   = 'origin';
var originMarker = null;
var destMarker   = null;

function makeClickIcon(label, color) {
    return L.divIcon({
        html: '<div style="position:relative;display:flex;flex-direction:column;align-items:center;">'
            + '<div style="background:' + color + ';color:#fff;padding:6px 14px;'
            + 'border-radius:8px;font-weight:800;font-size:13px;'
            + 'font-family:sans-serif;box-shadow:0 3px 8px rgba(0,0,0,0.5);'
            + 'white-space:nowrap;">' + label + '</div>'
            + '<div style="width:0;height:0;border-left:6px solid transparent;'
            + 'border-right:6px solid transparent;border-top:8px solid ' + color + ';'
            + 'margin-top:-1px;"></div></div>',
        iconSize:   [70, 36],
        iconAnchor: [35, 36],
        className:  'empty',
    });
}

map_2b04476b0ff190314cae6b7c1d9f023a.on('click', function(e) {
    var lat = e.latlng.lat;
    var lon = e.latlng.lng;

    if (clickState === 'origin') {
        if (originMarker) map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(originMarker);
        originMarker = L.marker([lat, lon], { icon: makeClickIcon('출발', '#ff3b30') })
                        .addTo(map_2b04476b0ff190314cae6b7c1d9f023a);
        clickState = 'dest';
        window.parent.postMessage({ type: 'SET_ORIGIN', lat: lat, lon: lon }, '*');

    } else if (clickState === 'dest') {
        if (destMarker) map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(destMarker);
        destMarker = L.marker([lat, lon], { icon: makeClickIcon('도착', '#00A84D') })
                      .addTo(map_2b04476b0ff190314cae6b7c1d9f023a);
        clickState = 'done';
        window.parent.postMessage({ type: 'SET_DEST', lat: lat, lon: lon }, '*');
    }
});

window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'RESET_MAP') {
        if (originMarker) { map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(originMarker); originMarker = null; }
        if (destMarker)   { map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(destMarker);   destMarker   = null; }
        clickState = 'origin';
    }
});
</script>
