<script>
    
    
            var map_2b04476b0ff190314cae6b7c1d9f023a = L.map(
                "map_2b04476b0ff190314cae6b7c1d9f023a",
                {
                    center: [37.5547, 126.9707],
                    crs: L.CRS.EPSG3857,
                    ...{
  "zoom": 15,
  "zoomControl": true,
  "preferCanvas": false,
}

                }
            );

            

        
    
            var tile_layer_677319b1c9b0a7b13ed03da9b9b8b478 = L.tileLayer(
                "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
                {
  "minZoom": 0,
  "maxZoom": 20,
  "maxNativeZoom": 20,
  "noWrap": false,
  "attribution": "\u0026copy; \u003ca href=\"https://www.openstreetmap.org/copyright\"\u003eOpenStreetMap\u003c/a\u003e contributors \u0026copy; \u003ca href=\"https://carto.com/attributions\"\u003eCARTO\u003c/a\u003e",
  "subdomains": "abcd",
  "detectRetina": false,
  "tms": false,
  "opacity": 1,
}

            );
        
    
            tile_layer_677319b1c9b0a7b13ed03da9b9b8b478.addTo(map_2b04476b0ff190314cae6b7c1d9f023a);





/*윤서영 추가 - 지도 클릭 이벤트 추가*/
var clickState   = 'origin';
var originMarker = null;
var destMarker   = null;

function makeClickIcon(label, color) {
    return L.divIcon({
        html: '<div style="position:relative;display:flex;flex-direction:column;align-items:center;">'
            + '<div style="background:' + color + ';color:#fff;padding:6px 14px;'
            + 'border-radius:8px;font-weight:800;font-size:13px;'
            + 'font-family:sans-serif;box-shadow:0 3px 8px rgba(0,0,0,0.5);'
            + 'white-space:nowrap;">' + label + '</div>'
            + '<div style="width:0;height:0;border-left:6px solid transparent;'
            + 'border-right:6px solid transparent;border-top:8px solid ' + color + ';'
            + 'margin-top:-1px;"></div></div>',
        iconSize:   [70, 36],
        iconAnchor: [35, 36],
        className:  'empty',
    });
}

map_2b04476b0ff190314cae6b7c1d9f023a.on('click', function(e) {
    var lat = e.latlng.lat;
    var lon = e.latlng.lng;

    if (clickState === 'origin') {
        if (originMarker) map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(originMarker);
        originMarker = L.marker([lat, lon], { icon: makeClickIcon('출발', '#ff3b30') })
                        .addTo(map_2b04476b0ff190314cae6b7c1d9f023a);
        clickState = 'dest';
        window.parent.postMessage({ type: 'SET_ORIGIN', lat: lat, lon: lon }, '*');

    } else if (clickState === 'dest') {
        if (destMarker) map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(destMarker);
        destMarker = L.marker([lat, lon], { icon: makeClickIcon('도착', '#00A84D') })
                      .addTo(map_2b04476b0ff190314cae6b7c1d9f023a);
        clickState = 'done';
        window.parent.postMessage({ type: 'SET_DEST', lat: lat, lon: lon }, '*');
    }
});

window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'RESET_MAP') {
        if (originMarker) { map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(originMarker); originMarker = null; }
        if (destMarker)   { map_2b04476b0ff190314cae6b7c1d9f023a.removeLayer(destMarker);   destMarker   = null; }
        clickState = 'origin';
    }
});


// 역 마커를 담을 레이어 그룹 생성
var stationLayer = L.layerGroup().addTo(map_2b04476b0ff190314cae6b7c1d9f023a);

function loadStationsInBounds() {
    // 지도 좌표 범위 가져오기
    var bounds = map_2b04476b0ff190314cae6b7c1d9f023a.getBounds();
    if (!bounds || !bounds.isValid()) return; // 범위가 유효하지 않으면 중단

    var bbox = bounds.getSouth() + ',' + bounds.getWest() + ',' + bounds.getNorth() + ',' + bounds.getEast();

    var query = `[out:json][timeout:10];(node["railway"="station"](${bbox});node["station"="subway"](${bbox}););out;`;
    var url =  'https://overpass.kumi.systems/api/interpreter?data=' + encodeURIComponent(query);

    fetch(url)
        .then(response => {
            if (!response.ok) throw new Error('API 응답 오류: ' + response.status);
            return response.json();
        })
        .then(data => {
            stationLayer.clearLayers(); // 기존 마커 초기화
            
            data.elements.forEach(function(el) {
                var stationName = el.tags.name || '역';
                
                var marker = L.circleMarker([el.lat, el.lon], {
                    radius: 7,
                    color: '#ffffff',
                    weight: 2.5,
                    fillColor: '#00A2FF',
                    fillOpacity: 0.95
                }).bindTooltip(stationName, { 
                    permanent: true, 
                    direction: 'top', 
                    offset: [0, -8],
                    className: 'station-label'
                });

                stationLayer.addLayer(marker);
            });
        })
        .catch(err => console.error('역 데이터 불러오기 실패:', err));
}

// 지도 이동/줌 완료 시 이벤트 연결
map_2b04476b0ff190314cae6b7c1d9f023a.on('moveend', loadStationsInBounds);

// 지도 준비 완료 시 최초 1회 실행
map_2b04476b0ff190314cae6b7c1d9f023a.whenReady(function() {
    loadStationsInBounds();
});
</script>
